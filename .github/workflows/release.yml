name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: GoReleaser
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true

      - name: Test
        run: go test ./...

      - name: Check release publishing token
        env:
          GORELEASER_PAT: ${{ secrets.GORELEASER_PAT }}
        run: |
          if [ -z "$GORELEASER_PAT" ]; then
            echo "::error::Missing GORELEASER_PAT. Create a fine-grained PAT that can write contents to Patruxs/utils, Patruxs/homebrew-tap, and Patruxs/scoop-bucket, then add it as an Actions secret named GORELEASER_PAT."
            exit 1
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v5
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          # GoReleaser reads the token from the GITHUB_TOKEN environment variable.
          # Use a PAT here because this workflow publishes to this repository and
          # pushes package files to Patruxs/homebrew-tap and Patruxs/scoop-bucket.
          GITHUB_TOKEN: ${{ secrets.GORELEASER_PAT }}
