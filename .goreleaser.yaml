# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: utils

builds:
  - id: utils
    main: ./cmd/tui
    binary: utils
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Tag }}

archives:
  - id: utils
    ids:
      - utils
    name_template: "{{ .ProjectName }}_{{ .Tag }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

release:
  github:
    owner: Patruxs
    name: utils

brews:
  - name: utils
    ids:
      - utils
    repository:
      owner: Patruxs
      name: homebrew-tap
      branch: main
      token: "{{ .Env.GITHUB_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "Brew formula update for {{ .ProjectName }} {{ .Tag }}"
    directory: Formula
    homepage: "https://github.com/Patruxs/utils"
    description: "Local developer utility hub for cleanup, infrastructure, and deployment workflows."
    install: |
      bin.install "utils"

scoops:
  - name: utils
    repository:
      owner: Patruxs
      name: scoop-bucket
      branch: main
      token: "{{ .Env.GITHUB_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "Scoop manifest update for {{ .ProjectName }} {{ .Tag }}"
    homepage: "https://github.com/Patruxs/utils"
    description: "Local developer utility hub for cleanup, infrastructure, and deployment workflows."
    shortcuts:
      - - utils.exe
        - UTILS
